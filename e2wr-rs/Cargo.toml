[workspace]
resolver = "2"
members = [
    "crates/e2wr-ir",
    "crates/e2wr-dd",
    "crates/e2wr-pass",
    "crates/e2wr",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
wasmparser = "0.240"
wasm-encoder = { version = "0.240", features = ["wasmparser"] }
anyhow = "1"
thiserror = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
libc = "0.2"
glob = "0.3"

[profile.release]
debug = true
